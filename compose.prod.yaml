# =========================================================================
# compose.prod.yaml — self-host em VM Debian
#
# Topologia:
#
#   Nginx Proxy Manager (container, network `npm_default`)
#     │  proxy_pass http://cdw-ads-manager-app-1:3000
#     ▼
#   app (container, networks: default + npm_default)
#     │
#     └─► postgres (container, network `default`) + volume persistente
#
# O NPM faz proxy via DNS interno do Docker — por isso a app precisa estar
# anexada à network `npm_default` (declarada como external aqui). Sem isso,
# `proxy_pass http://cdw-ads-manager-app-1:3000` não resolve e dá 502.
#
# O bind em 127.0.0.1:3000 é mantido só pra debug local na VM (curl direto).
# O tráfego de produção entra pelo NPM (portas 80/443 do host).
# Postgres não expõe porta alguma no host.
#
# Uso (na VM Debian):
#   1. Copie .env.example pra .env e preencha (use openssl pra gerar secrets)
#   2. docker compose -f compose.prod.yaml build
#   3. docker compose -f compose.prod.yaml run --rm bootstrap     # 1ª vez
#   4. docker compose -f compose.prod.yaml up -d                  # ergue app
#   5. Configure nginx no host com proxy_pass http://127.0.0.1:3000
#
# Re-deploy (depois de `git pull`):
#   docker compose -f compose.prod.yaml build app
#   docker compose -f compose.prod.yaml run --rm bootstrap        # se houver migrations novas
#   docker compose -f compose.prod.yaml up -d
# =========================================================================

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # Postgres 18+ usa subdir por major version (/var/lib/postgresql/<major>/docker/).
      # Mount no diretório pai pra encontrar o layout correto. Ver docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem `ports:` — Postgres só responde dentro da network interna.

  app:
    build:
      context: .
      target: runner
    image: franchise-hub:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # APP_DATABASE_URL aponta pro role `franchise_hub_app` (sem BYPASSRLS) —
      # impressa pelo `setup-app-role.ts` durante o bootstrap. Cole o valor
      # no .env e suba de novo (`up -d`). Sem ela o app usa o owner — funciona,
      # mas RLS fica ineficaz (owner ignora policies).
      DATABASE_URL: "${APP_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public}"
      # DIRECT_URL continua no owner — Prisma Migrate precisa de CREATE/ALTER.
      DIRECT_URL:   postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?defina NEXTAUTH_URL com sua URL pública}
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no .env}
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env}
      ADS_INTEGRATIONS_MODE: ${ADS_INTEGRATIONS_MODE:-mock}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      META_ADS_CLIENT_ID: ${META_ADS_CLIENT_ID:-}
      META_ADS_CLIENT_SECRET: ${META_ADS_CLIENT_SECRET:-}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    ports:
      # Bind no loopback: só debug local na VM (curl direto). Tráfego de
      # produção entra pelo NPM via DNS interno na network `npm_default`.
      - "127.0.0.1:3000:3000"
    networks:
      - default       # alcance ao postgres
      - npm_default   # alcance pelo Nginx Proxy Manager (proxy reverso)

  # Container one-shot: aplica migrations + role + (opcional) seed e encerra.
  # Roda com:  docker compose -f compose.prod.yaml run --rm bootstrap
  # Pra incluir seed: ... run --rm bootstrap bash scripts/bootstrap.sh --seed
  bootstrap:
    build:
      context: .
      target: ops
    image: franchise-hub-ops:latest
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL:   postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Credenciais do SUPER_ADMIN — só usadas quando o bootstrap roda com
      # --seed (default em prod via .github/workflows/deploy.yml). O seed
      # RECUSA criar o super admin se SUPER_ADMIN_PASSWORD estiver vazio
      # em produção (evita vazar a senha de dev).
      SUPER_ADMIN_EMAIL:    ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME:     ${SUPER_ADMIN_NAME:-}

volumes:
  postgres_data:

networks:
  # Network do Nginx Proxy Manager (criada pelo compose do NPM, em outro lugar).
  # `external: true` = "use a que já existe, não tente criar". Se o NPM ainda
  # não estiver de pé, `docker compose up` falha com mensagem clara.
  npm_default:
    external: true

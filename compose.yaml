# =========================================================================
# compose.yaml — desenvolvimento local
#
# Uso típico (dev: app no host com hot reload, banco no Docker):
#   docker compose up -d postgres
#   npm run dev
#
# Uso alternativo (app também no Docker — testa a imagem):
#   docker compose --profile full up --build
#
# Para o setup de produção (self-host na VM Debian), use compose.prod.yaml.
# =========================================================================

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-franchise_hub}
      POSTGRES_USER: ${POSTGRES_USER:-franchise_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-franchise_hub_dev}
    ports:
      # Expõe no host pra dev local com `npm run dev` conectar via localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ usa subdir por major version (/var/lib/postgresql/<major>/docker/).
      # Mount no diretório pai pra encontrar o layout correto. Ver docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-franchise_hub} -d ${POSTGRES_DB:-franchise_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # App opcional — só sobe com `--profile full`. Útil pra validar a imagem
  # localmente (mesma stack do prod, sem nginx).
  app:
    profiles: ["full"]
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # APP_DATABASE_URL aponta pro role `franchise_hub_app` (sem BYPASSRLS) —
      # impressa pelo `setup-app-role.ts` durante o bootstrap. Fallback pro
      # owner serve só pra primeiros runs antes do role existir; nesse modo
      # as policies de RLS são bypassed.
      DATABASE_URL: "${APP_DATABASE_URL:-postgresql://${POSTGRES_USER:-franchise_hub}:${POSTGRES_PASSWORD:-franchise_hub_dev}@postgres:5432/${POSTGRES_DB:-franchise_hub}?schema=public}"
      # DIRECT_URL continua no owner — Prisma Migrate precisa de CREATE/ALTER.
      DIRECT_URL:   postgresql://${POSTGRES_USER:-franchise_hub}:${POSTGRES_PASSWORD:-franchise_hub_dev}@postgres:5432/${POSTGRES_DB:-franchise_hub}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      ADS_INTEGRATIONS_MODE: ${ADS_INTEGRATIONS_MODE:-mock}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:

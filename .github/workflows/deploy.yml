# =========================================================================
# Deploy automático — SSH na VM Debian, rebuild da imagem, up -d.
#
# Pré-requisitos (já configurados em Repository secrets):
#   SSH_HOST         — IP ou hostname da VM
#   SSH_PORT         — porta SSH (22 ou custom)
#   SSH_USER         — usuário com acesso ao docker (no grupo `docker`)
#   SSH_PRIVATE_KEY  — chave privada (PEM/OpenSSH). Gere com:
#                        ssh-keygen -t ed25519 -f deploy-key -N ""
#                      e adicione a pública em ~/.ssh/authorized_keys na VM.
#
# Premissa: o checkout vive em /root/cdw-ads-manager na VM, e o primeiro
# bootstrap já rodou (role franchise_hub_app criado, APP_DATABASE_URL
# colado no .env). Re-runs do bootstrap aqui só aplicam migrations novas
# e revalidam o role — são idempotentes e não imprimem secrets de novo.
# =========================================================================

name: deploy

on:
  push:
    branches: [main]
    # Mudanças que não afetam runtime não precisam de deploy.
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".vscode/**"
  workflow_dispatch:

# 1 deploy por vez. Push em sequência rápida → o segundo enfileira em vez
# de competir pelo docker daemon / Postgres.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH + build na VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configurar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Evita prompt TOFU/StrictHostKeyChecking adicionando a chave
          # pública do host pinada no known_hosts.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -se <<'REMOTE'
            set -euo pipefail
            cd /root/cdw-ads-manager

            echo "::group::git fetch + reset --hard origin/main"
            git fetch --prune origin
            git reset --hard origin/main
            git log -1 --oneline
            echo "::endgroup::"

            echo "::group::tag imagem atual como :rollback"
            # Salva a imagem em execução pra rollback se o deploy quebrar.
            # Na primeira subida ainda não existe — segue silenciosamente.
            if docker image inspect franchise-hub:latest > /dev/null 2>&1; then
              docker image tag franchise-hub:latest franchise-hub:rollback
              echo "✓ franchise-hub:latest → franchise-hub:rollback"
            else
              echo "(sem imagem anterior — primeira subida)"
            fi
            echo "::endgroup::"

            echo "::group::docker compose build (app + bootstrap)"
            docker compose -f compose.prod.yaml build app bootstrap
            echo "::endgroup::"

            echo "::group::bootstrap (migrate deploy + setup-app-role + seed)"
            # Idempotente em todas as etapas: migrate deploy só aplica o que
            # falta; setup-app-role.ts preserva a senha; o seed faz upsert dos
            # tenants/usuários (sem duplicar) e pula ad accounts/campanhas se
            # já houver sync_logs naquele tenant.
            #
            # Rodar --seed em prod garante que tenants/usuários novos do
            # repo (ex.: super admin) cheguem ao banco — sem isso só o schema
            # vai e o login fica quebrado.
            #
            # `< /dev/null` é crítico: este script roda via `ssh ... bash -se
            # <<REMOTE`, e o bash do remoto lê os comandos da própria stdin.
            # `docker compose run` (sem -d) herda a stdin do bash e fica
            # segurando o fd, consumindo as linhas restantes do heredoc.
            # Resultado: tudo depois deste passo (o `up -d --force-recreate`
            # e o healthcheck loop) silenciosamente desaparecia, o step
            # ficava verde, e o container nunca era recriado — só vi
            # porque o app estava servindo código de 2 deploys atrás.
            docker compose -f compose.prod.yaml run --rm bootstrap \
              bash scripts/bootstrap.sh --seed < /dev/null
            echo "::endgroup::"

            echo "::group::docker compose up -d"
            # --force-recreate app: o build acima atualiza franchise-hub:latest
            # in-place. Sem force-recreate, o compose às vezes não detecta a
            # troca (tag idêntica) e mantém o container antigo — o site fica
            # "healthy" mas servindo código velho. O branch de rollback já usa
            # --force-recreate pelo mesmo motivo.
            docker compose -f compose.prod.yaml up -d --force-recreate app
            echo "::endgroup::"

            echo "::group::aguardando /api/health"
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
                echo "✓ healthy (após $((i * 2))s)"
                HEALTHY=1
                break
              fi
              sleep 2
            done
            echo "::endgroup::"

            if [[ $HEALTHY -eq 1 ]]; then
              # Limpa imagens dangling. A :rollback continua tagueada — preserva.
              docker image prune -f > /dev/null || true
              exit 0
            fi

            echo "::error::healthcheck falhou após 60s — iniciando rollback"
            echo "::group::logs do app (últimas 100 linhas)"
            docker compose -f compose.prod.yaml logs --tail=100 app || true
            echo "::endgroup::"

            if docker image inspect franchise-hub:rollback > /dev/null 2>&1; then
              echo "::group::rollback automático pra imagem anterior"
              docker image tag franchise-hub:rollback franchise-hub:latest
              docker compose -f compose.prod.yaml up -d --force-recreate app
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
                  echo "✓ rollback OK — site no ar com versão anterior (após $((i * 2))s)"
                  echo "::endgroup::"
                  # Falha o workflow de propósito — o commit precisa ser corrigido,
                  # mesmo que o rollback tenha restaurado o site.
                  exit 1
                fi
                sleep 2
              done
              echo "::error::rollback também não respondeu em 60s — intervenção manual"
              echo "::endgroup::"
            else
              echo "::error::sem imagem :rollback (primeira subida?) — site fora do ar"
            fi
            exit 1
          REMOTE
